<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 專屬你的 12 月倒數情書 ❤️</title>
    <style>
        /* 網站主體樣式 */
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            /* 建議：如果使用下雪特效，可以考慮將背景顏色改為深色，讓雪花（白色）更顯眼 */
            /* background-color: #34495e; */
            background-color: #34495e;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            /* 讓內容層在雪花之下 */
            position: relative; 
            z-index: 1; 
            overflow-x: hidden; 
        }

        h1 {
            color: #d63031;
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #fad390;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #636e72;
            font-size: 1rem;
        }

        /* 控制區 */
        .controls {
            margin-bottom: 20px;
        }

        .play-all-btn {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .play-all-btn:hover {
            background-color: #d63031;
            transform: scale(1.05);
        }
        
        .play-all-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 日曆網格 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .day-box {
            background: white;
            border-radius: 12px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #d63031;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            position: relative;
        }

        .day-box:hover {
            transform: translateY(-3px);
            border-color: #ff7675;
        }

        /* 今天 */
        .day-box.today {
            background-color: #d63031;
            color: white;
            animation: pulse 2s infinite;
        }
        
        /* 播放中 */
        .day-box.playing {
            background-color: #fdcb6e;
            color: white;
            border-color: #ffeaa7;
            transform: scale(1.1);
            z-index: 10;
        }

        /* 尚未解鎖的日子 (未來) */
        .day-box.locked {
            background-color: #eee;
            color: #bbb;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .day-box.locked:hover {
            transform: none;
            border-color: transparent;
        }

        /* 鎖頭圖示 */
        .lock-icon {
            font-size: 0.8rem;
            position: absolute;
            bottom: 5px;
            right: 5px;
            display: none;
        }
        .day-box.locked .lock-icon { display: block; }

        /* 彈出文字視窗 */
        .message-modal {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            display: none;
            border: 2px solid #fab1a0;
            z-index: 100;
        }

        .message-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #2d3436;
            margin-bottom: 15px;
            /* 讓換行符號生效 */
            white-space: pre-wrap;
        }

        .close-btn {
            padding: 8px 20px;
            background-color: #d63031;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
        /* 🎊 下載按鈕樣式 (優化新增) */
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0984e3; /* 藍色系，區別於紅色 */
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(214, 48, 49, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(214, 48, 49, 0); }
            100% { box-shadow: 0 0 0 0 rgba(214, 48, 49, 0); }
        }

        /* === ❄️ 雪花效果 CSS (新增) === */
        /* 雪花容器 */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓雪花不會阻擋點擊下面的內容 */
            z-index: 9999; /* 確保雪花在最上層 */
            overflow: hidden; 
        }

        .snowflake {
            color: #fff; /* 雪花顏色 */
            font-size: 1.5em; /* 雪花大小 */
            font-family: Arial, sans-serif;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); /* 輕微陰影增加立體感 */
            position: absolute;
            top: -10%; /* 從視窗上方開始 */
            /* ❗ 移除 opacity: 0; 讓 JS 來設定起始透明度，避免閃爍 */
            animation: fall linear infinite; /* 套用下落動畫 */
        }

        /* 定義雪花下落動畫 */
        @keyframes fall {
            to {
                transform: translateY(100vh); 
                /* ❗ 移除 opacity: 1; 讓透明度由 JS 統一控制 */
            }
        }
        /* 瀏覽器相容性前綴 */
        @-webkit-keyframes fall {
            to {
                -webkit-transform: translateY(100vh); 
                /* ❗ 移除 opacity: 1; */
            }
        }
        /* === ❄️ 雪花效果 CSS 結束 === */

    </style>
</head>
<body>

    <div class="snowflakes" aria-hidden="true">
        </div>
    <h1>🎅 December Love</h1>
    <div class="subtitle">戴上耳機，點擊今天的日期...</div>

    <div class="controls">
        <button class="play-all-btn" id="play-all-btn" onclick="playAllMemories()">
            <span>▶</span> 播放直到今天的回憶
        </button>
    </div>

    <div class="calendar-grid" id="calendar">
    </div>

    <div class="message-modal" id="modal">
        <div class="message-text" id="msg-content">...</div>
        <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>

    <script>
        // 請把引號內的網址換成你的 Google Drive 或 Dropbox 分享連結
        const DOWNLOAD_LINK = "https://drive.google.com/drive/folders/1-Vzro7fkGqRzO7VE5bvKNYL19MItTG2u?usp=sharing";
        // 為了方便您現在測試，我加了一個「測試模式」
        // 如果設為 true：所有日期都會解鎖 (方便您檢查)
        // 如果設為 false：會抓取真實日期 (送給女友時請改成 false)
        const TEST_MODE = false; 

        // 31 句台詞資料庫
        const messages = {
            1: "12月的第一天，只是想告訴你，這個月因為有你，冬天好像就沒有那麼冷了……記得把接下來的每一天都空給我呦～",
            2: "天氣變冷了，記得多穿一點喔……你是笨蛋嗎？穿這麼少萬一感冒了怎麼辦……真是的，外套借你啦，要記得感謝我喔。",
            3: "今天去了一間很棒的店喝到了還不錯的咖啡呢，蛋糕也很好吃！雖然露恰對咖啡不是很懂……但如果可以的話，下次想跟你一起去。",
            4: "把手伸出來！嗯？我要檢查你的手是不是又變成冰塊了呀。……哼哼，露恰的手果然比較溫暖對吧？就借你牽一下吧～",
            5: "有很好聞的味道？喔，應該是因為換了新香水的關係吧？……很適合露恰？那當然，這可是特地挑的喔。",
            6: "嗯……這個很適合拿來當歐咪呀給呢，感覺露軍會喜歡……嗯？你的呢？當然也有啦～才不會少了你的那份呢。",
            7: "周末就是想跟你窩在沙發上一整天，就算什麼都不做，看著你也覺得很幸福呢……嘿嘿，沒錯！我想你了，快點來陪我啦。",
            8: "新的一週來啦～希望這個星期也能和你一起開開心心！",
            9: "閉上眼睛許個願，希望明天一張開眼，就能看到你傻傻的笑臉。晚安，祝你有個好夢。",
            10: "已經10號了，我對你的喜歡，好像又比月初多了一點點。那麼你呢？也有更喜歡露恰了嗎？",
            11: "今天在路上啊看到好多聖誕節裝飾喔，那些點亮的小燈泡就像星星一樣美麗……如果可以跟你一起去看的話，肯定會更開心～",
            12: "最近大家都大包小包的、買了好多東西喔，但是露恰只想把某個人打包帶回家。……而那個笨蛋現在正在聽這段語音，真是的，有點自覺把自己外送過來好嗎？",
            13: "好冷喔～好想吃火鍋～齁喲，什麼叫做露恰小獺胃又吃不完，有你陪我一起吃不就可以了嗎？",
            14: "哼哼♪……嗯？啊，就是剛剛呀～露恰聽到一首旋律還蠻好聽的歌，感覺好像可以之後歌回的時候唱呢。或者，你想要唱給露恰聽的話，也不是不可以喔～",
            15: "12月已經過了一半了耶，準備好把你的聖誕節、還有你的心，通通交給我了嗎？",
            16: "雖然還沒到聖誕節，但露恰好像已經收到最好的禮物了…………嗯，就是你呀。",
            17: "今天好累喔～忙了一整天，感覺都快要斷電了……可以……讓我抱一下嗎？唔，露恰只是想充充電嘛！就一下下……唉呦你不要笑啦！",
            18: "把手給我～嘿嘿，跟你走在一起的時候，風好像真的沒那麼大了。而且呢……既然都牽著了，露恰就不打算放手囉。",
            19: "……這句話露恰只說一次喔，如果你沒聽到就算了。就是啊、未來的日子……你應該都有把露恰排進去的吧？我隨便問問的啦！……但如果你敢說沒有，你就死定了。",
            20: "聖誕節快到了耶……欸，你該不會有在偷偷準備給我的驚喜吧？……如果沒有的話露恰會很失望的喔。就算只是一張卡片我也……算了，沒事。",
            21: "冬至快樂！你吃湯圓了嗎？希望你的每一個願望都能實現。當然啦，如果那些願望裡面也有露恰一起的話就太好了呢～",
            22: "我想把今年剩下的每一天、每一分、每一秒，都預約給你……你有空嗎？",
            23: "禮物準備好了沒？露恰可是期待很久了。要是敢亂送些有的沒的，露恰就咬你喔。……如果是我喜歡的東西？那就……再看看囉～",
            24: "平安夜快樂。把手給我。……沒什麼，只是覺得今天晚上，如果不牽著你，心裡會有點空空的。",
            25: "聖誕快樂！送你的禮物，你有喜歡嗎？嗯？露恰的願望？哼哼，已經實現了喔，因為此刻你就在這裡，對露恰來說這就是最棒的聖誕節。",
            26: "有點累了……借露恰靠一下充電。別動喔。……我今天不想講道理，也不想裝成熟，只想任性地賴著你……可以嗎？",
            27: "認真回想這一年，雖然露恰真的很愛欺負你，但那是因為我喜歡看你拿我沒辦法的樣子。……你懂不懂啊？這顆木頭！",
            28: "突然發現，露恰現在每天最期待的時刻，就是可以聽到你的聲音，並且和你分享好多好多快樂的、難過的事情……好像只要和你在一起，就什麼困難都不怕了呢！",
            29: "跨年你打算去哪裡呢？嗯……露恰的話，去哪都無所謂。重點是……要在你旁邊。這才是最重要的～",
            30: "露恰明年的願望清單嘛……第一條就是「繼續欺負你」，第二條是「把你變漂漂」。嗯？你有意見嗎？駁回！",
            31: "這是露恰給你的告白，請好好地聽喔！"
        };

        const calendar = document.getElementById('calendar');
        const modal = document.getElementById('modal');
        const msgContent = document.getElementById('msg-content');
        let currentAudio = null;
        let isPlayingSequence = false; // 是否正在連續播放

        // 計算現在是幾月幾號
        const now = new Date();
        const realMonth = now.getMonth() + 1;
        const realDay = now.getDate();
        
        // 決定目前解鎖到第幾天
        // 如果是 12月，解鎖到當天；如果還沒到 12月，全是鎖住的(除非測試模式)；如果過了12月，全部解鎖
        let unlockedDay = 0;
        if (TEST_MODE) {
            unlockedDay = 31; // 測試模式全開
        } else if (realMonth === 12) {
            unlockedDay = realDay;
        } else if (realMonth > 12) {
            unlockedDay = 31;
        } else {
            unlockedDay = 0; // 還沒到12月
        }

        // 產生 1-31 的格子
        for (let i = 1; i <= 31; i++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            dayBox.innerHTML = `${i} <span class="lock-icon">🔒</span>`;
            dayBox.id = `day-${i}`;

            if (i <= unlockedDay) {
                // 已解鎖的日子
                if (i === unlockedDay) dayBox.classList.add('today'); // 今天特別標示
                dayBox.onclick = () => playSingleVoice(i);
            } else {
                // 未來與鎖定的日子
                dayBox.classList.add('locked');
                dayBox.onclick = () => alert("偷看是不行的喔！時間到了才能打開！");
            }
            
            calendar.appendChild(dayBox);
        }

        // 播放單一語音
        function playSingleVoice(day) {
            if (isPlayingSequence) stopSequence(); // 如果正在連續播，先停止

            stopAudio(); // 停止當前聲音
            
            const element = document.getElementById(`day-${day}`);
            
            // 播放音檔
            playAudioFile(day, () => {
                element.classList.remove('playing'); 
            }, () => {
                element.classList.add('playing'); 
                showModal(messages[day] || "（這天還沒有寫悄悄話喔）", day);
            });

        }

        // 連續播放功能 (從第1天播到已解鎖的最後一天)
        async function playAllMemories() {
            if (unlockedDay === 0) {
                alert("還沒到 12 月，沒有回憶可以播放喔！");
                return;
            }

            if (isPlayingSequence) {
                stopSequence(); // 如果已經在播，再次點擊則停止
                return;
            }

            isPlayingSequence = true;
            document.getElementById('play-all-btn').innerText = "⏹ 停止播放";
            showModal("🎧 開始回顧我們的 12 月...");

            // 使用遞迴或迴圈來依序播放
            for (let i = 1; i <= unlockedDay; i++) {
                if (!isPlayingSequence) break; // 中斷檢查

                // 高亮目前的格子
                const element = document.getElementById(`day-${i}`);
                element.classList.add('playing');
                // 顯示該天的文字，並檢查是否為 31 號 (會在 showModal 裡處理下載按鈕)
                showModal(`📅 12月${i}日：\n\n${messages[i]}`, i); 

                // 等待這個音檔播完
                await new Promise((resolve) => {
                    const audioPath = `audio/${i}.mp3`;
                    currentAudio = new Audio(audioPath);
                    currentAudio.play().catch(e => {
                        console.log("播放失敗或找不到檔案:", e);
                        resolve(); // 失敗也繼續下一首
                    });
                    
                    currentAudio.onended = resolve; // 播完後 resolve
                });

                element.classList.remove('playing');
                // 每個音檔之間稍微停頓 3 秒，更有氣氛
                if(isPlayingSequence) await new Promise(r => setTimeout(r, 3000));
            }

            // ⭐ 優化: 手動重置狀態，但不關閉模態框，讓最後一天的資訊留存
            isPlayingSequence = false; 
            stopAudio(); // 確保音樂停止，並清除播放中的高亮
            document.getElementById('play-all-btn').innerText = "▶ 播放直到今天的回憶";
        }

        // 播放音檔的底層函式
        function playAudioFile(day, onEnd, onStart) {
            const audioPath = `audio/${day}.mp3`;
            currentAudio = new Audio(audioPath);
            
            currentAudio.play().then(() => {
                if(onStart) onStart();
            }).catch(error => {
                // ⭐ 優化: 將 alert 改為 showModal 顯示錯誤
                showModal(`📅 12月${day}日：\n\n找不到這天的錄音檔喔！\n\n請確認您的 audio 資料夾中是否有 ${day}.mp3 檔案。`, day);
                console.error(error);
                if(onEnd) onEnd();
            });

            currentAudio.onended = onEnd;
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            document.querySelectorAll('.day-box').forEach(box => box.classList.remove('playing'));
        }

        function stopSequence() {
            isPlayingSequence = false;
            stopAudio();
            document.getElementById('play-all-btn').innerText = "▶ 播放直到今天的回憶";
            closeModal();
        }

        function showModal(text, day) { 
            // 設定文字內容
            msgContent.innerText = text;

            // 檢查是否為第 31 天，如果是，加入下載按鈕
            const existingBtn = document.getElementById('download-btn');
            if (existingBtn) existingBtn.remove(); // 先移除舊按鈕避免重複

            if (day === 31) {
                const downloadBtn = document.createElement('a');
                downloadBtn.id = 'download-btn';
                downloadBtn.href = DOWNLOAD_LINK;
                downloadBtn.target = "_blank"; // 在新分頁開啟
                downloadBtn.innerText = "☁️ 下載收藏我們的回憶";
                
                // 使用 CSS class 來設定樣式
                downloadBtn.classList.add('download-btn'); 

                // 把按鈕加到 modal 底部
                modal.appendChild(downloadBtn);
            }

            modal.style.display = 'block';
        }


        function closeModal() {
            modal.style.display = 'none';
            // 由於下載按鈕是直接加到 modal 上的，關閉時一併移除避免下次開啟時重複
            const existingBtn = document.getElementById('download-btn');
            if (existingBtn) existingBtn.remove();
            
            if (!isPlayingSequence) { // 如果不是連續播放模式，關視窗就停音樂
                stopAudio();
            }
        }
        
        // === ❄️ 雪花效果 JavaScript (防閃爍修正) ===
        document.addEventListener('DOMContentLoaded', () => {
            const snowflakesContainer = document.querySelector('.snowflakes');
            const numberOfSnowflakes = 50; // 您希望有多少片雪花

            function createSnowflake() {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.textContent = (Math.random() > 0.5) ? '❅' : '❆'; // 隨機選擇雪花圖案
                
                // 隨機位置
                snowflake.style.left = Math.random() * 100 + 'vw';
                
                // 隨機大小
                snowflake.style.fontSize = Math.random() * 1.5 + 0.8 + 'em'; // 0.8em 到 2.3em
                
                // 隨機動畫時間
                snowflake.style.animationDuration = Math.random() * 10 + 5 + 's'; // 5s 到 15s
                
                // 隨機動畫延遲
                snowflake.style.animationDelay = Math.random() * numberOfSnowflakes + 's';
                
                // ⭐ 修正閃爍問題：確保雪花在開始時就有一個穩定的透明度
                const randomOpacity = Math.random() * 0.7 + 0.3; // 0.3 到 1.0
                snowflake.style.opacity = randomOpacity; 

                snowflakesContainer.appendChild(snowflake);

                // 當雪花落到底部後，重置它的位置 (使其循環)
                snowflake.addEventListener('animationiteration', () => {
                    snowflake.style.left = Math.random() * 100 + 'vw';
                    snowflake.style.animationDuration = Math.random() * 10 + 5 + 's';
                    snowflake.style.fontSize = Math.random() * 1.5 + 0.8 + 'em';
                    // 維持原有的隨機透明度
                    snowflake.style.opacity = Math.random() * 0.7 + 0.3; 
                });
            }

            for (let i = 0; i < numberOfSnowflakes; i++) {
                createSnowflake();
            }
        });
        // === ❄️ 雪花效果 JavaScript 結束 ===

    </script>
</body>
</html>
