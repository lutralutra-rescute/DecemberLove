<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 2025 Collection：A Cozy Gift For You 🩵</title>
<style>
    /* 網站主體樣式 */
    body {
        font-family: 'Microsoft JhengHei', sans-serif;
        background-image: url('images/okumono-curtain6.png'); 
        background-size: cover; 
        background-position: center center; 
        background-repeat: no-repeat; 
        background-attachment: fixed; 
        color: white; 
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0; padding: 0; 
        position: relative; 
        z-index: 1; 
        overflow-x: hidden; 
        user-select: none;
    }

    .main-content {
        flex-grow: 1; 
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 800px; 
        padding: 40px 10px 20px 10px; /* 增加上方間距給書籤 */
        position: relative; 
        z-index: 5;
    }

    /* 📌 書籤標籤設計 */
    .year-tag {
        position: relative;
        background: #ff7675; /* 絲帶顏色 */
        color: white;
        padding: 10px 15px 15px 15px;
        font-family: 'Arial', sans-serif;
        font-weight: bold;
        font-size: 0.8rem;
        letter-spacing: 1px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        display: inline-block;
        margin-bottom: 30px;
        transform-origin: top center;
        animation: swing 3s ease-in-out infinite;
        z-index: 10;
    }

    /* 書籤底部的 V 型剪裁 */
    .year-tag::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 0;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 15px 23px 0 23px; /* 寬度需手動微調配合 padding */
        border-color: #ff7675 transparent transparent transparent;
    }

    /* 書籤上方的小鉚釘圓孔 */
    .year-tag::before {
        content: "";
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        background: #2c3e50;
        border-radius: 50%;
        box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
    }

    /* 輕微擺動動畫 */
    @keyframes swing {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
    }

    h1 {
        color: #ff7675; 
        font-size: 1.8rem;
        margin-top: 0;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
        text-align: center;
    }

    .subtitle {
        margin-bottom: 25px;
        color: #ecf0f1; 
        font-size: 1rem;
        opacity: 0.9;
    }

    /* 格子樣式 */
    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 12px;
        width: 100%;
        max-width: 600px;
    }

    .day-box {
        background: #ecf0f1; 
        border-radius: 12px;
        height: 70px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.4rem;
        font-weight: bold;
        color: #2c3e50; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
        position: relative;
        overflow: hidden; 
    }

    .day-box.playing { background-color: #fdcb6e; transform: scale(1.1); }
    .day-box.locked { background-color: #4a637a; color: #95a5a6; cursor: not-allowed; }
    .lock-icon { font-size: 0.8rem; position: absolute; bottom: 5px; right: 5px; display: none; color: white; }
    .day-box.locked .lock-icon { display: block; }

    /* Modal 與其他樣式省略，保持與之前一致 */
    .message-modal { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: white; padding: 20px; border-radius: 20px; display: none; z-index: 100; color: #2d3436; text-align: center; }
    .message-image { max-width: 100%; border-radius: 10px; margin: 10px 0; }
    .close-btn { padding: 8px 20px; background: #ff7675; color: white; border: none; border-radius: 20px; cursor: pointer; }
    .play-all-btn { background: #ff7675; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; margin-bottom: 20px; }
    .snow-box { position: fixed; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .footer-links { display: flex; gap: 20px; margin-top: 30px; z-index: 10; }
    .social-icon { width: 50px; height: 50px; background: #4a637a; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: white; }
</style>
</head>
<body>

    <div class="snow-box"></div>
    
    <div class="main-content">
        <div id="year-tag-container">
            <div class="year-tag">2025 MEMORIES</div>
        </div>

        <h1 id="main-title">我們的冬日情書 ✨</h1>
        <div class="subtitle">那些閃閃發光的日子，都在這裡...</div>

        <div class="controls">
            <button class="play-all-btn" id="play-all-btn" onclick="playAllMemories()">
                <span>▶</span> 重新回顧與露恰的所有回憶
            </button>
        </div>

        <div class="calendar-grid" id="calendar"></div>
    </div>

    <div class="message-modal" id="modal">
        <div class="message-text" id="msg-content"></div>
        <img id="modal-image" class="message-image" style="display:none;"> 
        <button class="close-btn" onclick="closeModal()">關閉</button>
    </div>

    <div class="footer-links">
        <a href="https://x.com/Lutra_rescute" target="_blank" class="social-icon">X</a>
        <a href="https://lit.link/zh-tw/lutralutra" target="_blank" class="social-icon">Link</a>
        <a href="https://www.youtube.com/channel/UCmyc8eVR3G9A7hjaHsLR6NQ/videos" target="_blank" class="social-icon">YT</a>
    </div>

    <script>
        // ... (保持原本的 messages, imageMap, DOWNLOAD_LINK 等設定) ...
        const messages = { 1: "...", /* 請填入你原本的內容 */ };
        const imageMap = { 3: 'images/3.jpg', /* 請填入你原本的內容 */ };

        const now = new Date();
        const realyear = now.getFullYear();
        const realMonth = now.getMonth() + 1;
        const realDay = now.getDate();

        let unlockedDay = 0;
        // 進入 2026 年的邏輯
        if (realyear > 2025) {
            unlockedDay = 31;
            document.getElementById('main-title').innerText = "我們的 12 月回憶 🩵";
            document.querySelector('.subtitle').innerText = "那是個特別溫暖的冬天，對吧？";
            document.getElementById('play-all-btn').innerHTML = "<span>▶</span> 重新播放 2025 所有語音";
        } else if (realyear === 2025 && realMonth === 12) {
            unlockedDay = realDay;
        }

        const calendar = document.getElementById('calendar');
        for (let i = 1; i <= 31; i++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            dayBox.innerHTML = `${i} <span class="lock-icon">🔒</span>`;
            if (i <= unlockedDay) {
                dayBox.onclick = () => playSingleVoice(i);
            } else {
                dayBox.classList.add('locked');
            }
            calendar.appendChild(dayBox);
        }

        // ... (其餘播放邏輯 playSingleVoice, playAllMemories, showModal 等保持不變) ...
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
